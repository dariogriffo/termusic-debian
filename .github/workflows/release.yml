name: Build termusic for Debian

on:
  workflow_dispatch:
    inputs:
      termusic_version:
        description: The version of termusic to build.
        type: string
        required: true
      build_version:
        description: The build version.
        type: string
        required: true
      architecture:
        description: Architecture to build (amd64, arm64, or 'all' for all architectures)
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'amd64'
          - 'arm64'

permissions:
  contents: write

jobs:
  build-termusic:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout termusic-debian
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build termusic
        run: ./build.sh ${{ inputs.termusic_version }} ${{ inputs.build_version }} ${{ inputs.architecture }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: termusic_*.deb

  build-src:
    name: Build Source Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout termusic-debian
        uses: actions/checkout@v4

      - name: Install dpkg-dev and tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev devscripts wget ca-certificates

      - name: Build source packages
        run: ./build_src.sh ${{ inputs.termusic_version }} ${{ inputs.build_version }}

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-artifact
          path: |
            termusic_*.dsc
            termusic_*.orig.tar.gz
            termusic_*.debian.tar.xz

  release-termusic:
    name: Release termusic for Debian
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build-termusic
      - build-src
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Download Source Artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-artifact

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            termusic_*.deb
            termusic_*.dsc
            termusic_*.orig.tar.gz
            termusic_*.debian.tar.xz
          name: ${{ inputs.termusic_version }}+${{ inputs.build_version }}
          tag_name: ${{ inputs.termusic_version }}+${{ inputs.build_version }}
          fail_on_unmatched_files: true
